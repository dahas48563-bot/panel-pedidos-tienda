<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pedidos - Tienda</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .container { max-width: 900px; margin: 0 auto; }
        .bt-status-bar { text-align: center; margin-bottom: 20px; }
        .btn-bt { background: #8e44ad; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .btn-bt:hover { background: #732d91; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-left: 5px solid #27ae60; transition: all 0.3s ease; }
        .card.entregado { border-left-color: #95a5a6; background: #f9f9f9; opacity: 0.7; }
        .info div { margin-bottom: 6px; }
        .info strong { color: #555; }
        .total-badge { background: #e67e22; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .btn-print { background: #2980b9; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-print:hover { background: #1f618d; }
        .btn-done { background: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-done:hover { background: #219653; }
        .btn-delete { background: #c0392b; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn-delete:hover { background: #962d22; }
        .loading { text-align: center; font-size: 1.2em; color: #7f8c8d; margin-top: 40px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Panel de Pedidos en Vivo</h1>
    <div class="bt-status-bar">
        <button class="btn-bt" onclick="conectarBluetooth()">🔵 Conectar Impresora Bluetooth</button>
        <div id="bt-status" style="margin-top: 6px; font-size: 13px; color: #7f8c8d;">Estado: Desconectada</div>
    </div>
    <div id="pedidos-list" class="loading">Cargando pedidos recientes...</div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyAqwdqfY2q39TVxXBWkyQ_SYLSAS_pnadya1BWoTfCvCxyPVDNEjR-nVNy61IZJym8qg/exec";
    
    let bluetoothDevice = null;
    let bluetoothCharacteristic = null;

    async function conectarBluetooth() {
        const statusDiv = document.getElementById('bt-status');
        try {
            statusDiv.innerText = "Buscando impresora...";
            bluetoothDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-41aa-97b2-670f5087412e', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
            });

            const server = await bluetoothDevice.gatt.connect();
            const services = await server.getPrimaryServices();
            
            for (const service of services) {
                const characteristics = await service.getCharacteristics();
                for (const char of characteristics) {
                    if (char.properties.write || char.properties.writeWithoutResponse) {
                        bluetoothCharacteristic = char;
                        break;
                    }
                }
                if (bluetoothCharacteristic) break;
            }

            if (bluetoothCharacteristic) {
                statusDiv.innerHTML = `<span style="color:green; font-weight:bold;">🟢 Conectado a: ${bluetoothDevice.name || 'Impresora Térmica'}</span>`;
            } else {
                statusDiv.innerText = "Dispositivo sin características de escritura.";
            }
        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Error o conexión cancelada.";
        }
    }

    function cargarPedidos() {
        const contenedor = document.getElementById('pedidos-list');

        fetch(WEB_APP_URL, { redirect: "follow" })
            .then(response => response.json())
            .then(data => {
                if (!Array.isArray(data) || data.length === 0) {
                    contenedor.innerHTML = "<p style='text-align:center;'>No hay pedidos registrados.</p>";
                    return;
                }

                contenedor.innerHTML = "";
                data.slice().reverse().forEach((p, index) => {
                    const id = p.id || p.ID || "Sin ID";
                    const fecha = p.fecha || p.FECHA || "";
                    const hora = p.hora || p.HORA || "";
                    const cliente = p.cliente || p.CLIENTE || "Cliente sin nombre";
                    const telefono = p.telefono || p.TELEFONO || "Sin número";
                    const pedido = p.pedido || p.PEDIDO || "Sin detalles";
                    const direccion = p.direccion || p.DIRECCION || "No especificada";
                    const pago = p.pago || p.PAGO || "Efectivo";
                    const total = p.total || p.TOTAL || "$0.00";

                    const cardId = `card-${index}`;
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.id = cardId;
                    
                    card.innerHTML = `
                        <div class="info">
                            <div><strong>ID:</strong> ${id} | 🕒 ${fecha} ${hora}</div>
                            <div><strong>Cliente:</strong> ${cliente} (${telefono})</div>
                            <div><strong>Pedido:</strong> ${pedido}</div>
                            <div><strong>Dirección:</strong> ${direccion}</div>
                            <div><strong>Pago:</strong> ${pago}</div>
                            <div style="margin-top: 8px;"><strong>Total:</strong> <span class="total-badge">${total}</span></div>
                        </div>
                        <div class="actions">
                            <button class="btn-print" onclick="imprimirTicket('${id}', '${fecha}', '${hora}', '${cliente}', '${telefono}', '${pedido}', '${direccion}', '${total}', '${pago}')">🖨️ Imprimir</button>
                            <button class="btn-done" onclick="marcarEntregado('${cardId}')">✅ Entregado</button>
                            <button class="btn-delete" onclick="eliminarPedido('${cardId}')">🗑️ Eliminar</button>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });
            })
            .catch(error => {
                contenedor.innerHTML = "<p style='text-align:center; color:red;'>Error al cargar pedidos.</p>";
            });
    }

    function marcarEntregado(cardId) {
        const card = document.getElementById(cardId);
        card.classList.toggle('entregado');
        const btn = card.querySelector('.btn-done');
        if (card.classList.contains('entregado')) {
            btn.innerText = "🔄 Pendiente";
            btn.style.background = "#e67e22";
        } else {
            btn.innerText = "✅ Entregado";
            btn.style.background = "#27ae60";
        }
    }

    function eliminarPedido(cardId) {
        if (confirm("¿Estás seguro de quitar este pedido de la pantalla?")) {
            const card = document.getElementById(cardId);
            card.style.transform = "scale(0.9)";
            card.style.opacity = "0";
            setTimeout(() => card.remove(), 300);
        }
    }

    function limpiarTexto(texto) {
        return texto.normalize("NFD")
                    .replace(/[\u0300-\u036f]/g, "")
                    .replace(/ñ/g, "n")
                    .replace(/Ñ/g, "N");
    }

    async function enviarTextoImpresora(texto) {
        if (!bluetoothCharacteristic) {
            alert("Primero presiona el botón 'Conectar Impresora Bluetooth' arriba.");
            return;
        }
        const encoder = new TextEncoder();
        const data = encoder.encode(texto + "\n\n\n");
        await bluetoothCharacteristic.writeValue(data);
    }

    function imprimirTicket(id, fecha, hora, cliente, telefono, pedido, direccion, total, pago) {
        if (bluetoothCharacteristic) {
            let ticket = `TIENDITA / RECAUDERIA\n`;
            ticket += `Ticket de Pedido por Voz\n`;
            ticket += `--------------------------------\n`;
            ticket += `Folio: ${id}\n`;
            ticket += `Fecha: ${fecha} ${hora}\n`;
            ticket += `--------------------------------\n`;
            ticket += `Cliente: ${cliente}\n`;
            ticket += `Tel: ${telefono}\n`;
            ticket += `Direccion: ${direccion}\n`;
            ticket += `--------------------------------\n`;
            ticket += `PRODUCTOS:\n${pedido}\n`;
            ticket += `--------------------------------\n`;
            ticket += `Metodo Pago: ${pago}\n`;
            ticket += `TOTAL: ${total}\n`;
            ticket += `--------------------------------\n`;
            ticket += `!Gracias por su compra!\n\n`;
            
            let ticketLimpio = limpiarTexto(ticket);
            enviarTextoImpresora(ticketLimpio);
        } else {
            window.print();
        }
    }

    setInterval(cargarPedidos, 15000);
    window.onload = cargarPedidos;
</script>

</body>
</html>
