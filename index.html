<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Pedidos - Tienda</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-left: 5px solid #27ae60; }
        .info div { margin-bottom: 6px; }
        .info strong { color: #555; }
        .total-badge { background: #e67e22; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; }
        .btn-print { background: #2980b9; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-print:hover { background: #1f618d; }
        .loading { text-align: center; font-size: 1.2em; color: #7f8c8d; margin-top: 40px; }

        @media print {
            body * { visibility: hidden; }
            .ticket-impresion, .ticket-impresion * { visibility: visible; }
            .ticket-impresion { position: absolute; left: 0; top: 0; width: 58mm; font-family: 'Courier New', monospace; font-size: 11px; padding: 5px; color: #000; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Panel de Pedidos en Vivo</h1>
    <div id="pedidos-list" class="loading">Cargando pedidos recientes...</div>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzaJPzil9n2NJjR_bm5Q6maei7M48aJeiV9aFnFKf6WVdHq0ywnsUISmoihLPjVKUpLeQ/exec";

    function cargarPedidos() {
        const contenedor = document.getElementById('pedidos-list');

        fetch(WEB_APP_URL, { redirect: "follow" })
            .then(response => {
                if (!response.ok) throw new Error("Error en la respuesta de red");
                return response.json();
            })
            .then(data => {
                if (!Array.isArray(data) || data.length === 0) {
                    contenedor.innerHTML = "<p style='text-align:center;'>No hay pedidos registrados todavía.</p>";
                    return;
                }

                contenedor.innerHTML = "";
                data.slice().reverse().forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="info">
                            <div><strong>ID:</strong> ${p.id} | 🕒 ${p.fecha} ${p.hora}</div>
                            <div><strong>Cliente:</strong> ${p.cliente} (${p.telefono})</div>
                            <div><strong>Pedido:</strong> ${p.pedido}</div>
                            <div><strong>Dirección:</strong> ${p.direccion}</div>
                            <div><strong>Pago:</strong> ${p.pago}</div>
                            <div style="margin-top: 8px;"><strong>Total:</strong> <span class="total-badge">${p.total}</span></div>
                        </div>
                        <div>
                            <button class="btn-print" onclick="imprimirTicket('${p.id}', '${p.fecha}', '${p.hora}', '${p.cliente}', '${p.telefono}', '${p.pedido}', '${p.direccion}', '${p.total}', '${p.pago}')">🖨️ Imprimir Ticket</button>
                        </div>
                    `;
                    contenedor.appendChild(card);
                });
            })
            .catch(error => {
                console.error("Error al cargar pedidos:", error);
                contenedor.innerHTML = "<p style='text-align:center; color:red;'>Error al cargar los pedidos desde Google Sheets.</p>";
            });
    }

    function imprimirTicket(id, fecha, hora, cliente, telefono, pedido, direccion, total, pago) {
        const ticketDiv = document.createElement('div');
        ticketDiv.className = 'ticket-impresion';
        ticketDiv.innerHTML = `
            <div style="text-align:center; font-weight:bold; font-size:14px;">TIENDITA / RECAUDERÍA</div>
            <div style="text-align:center;">Ticket de Pedido por Voz</div>
            <div>--------------------------------</div>
            <div><strong>Folio:</strong> ${id}</div>
            <div><strong>Fecha:</strong> ${fecha} ${hora}</div>
            <div>--------------------------------</div>
            <div><strong>Cliente:</strong> ${cliente}</div>
            <div><strong>Tel:</strong> ${telefono}</div>
            <div><strong>Dirección:</strong> ${direccion}</div>
            <div>--------------------------------</div>
            <div><strong>PRODUCTOS:</strong></div>
            <div>${pedido}</div>
            <div>--------------------------------</div>
            <div><strong>Método Pago:</strong> ${pago}</div>
            <div style="font-size:13px; font-weight:bold;">TOTAL: ${total}</div>
            <div>--------------------------------</div>
            <div style="text-align:center; margin-top:5px;">¡Gracias por su compra!</div>
        `;
        document.body.appendChild(ticketDiv);
        window.print();
        document.body.removeChild(ticketDiv);
    }

    setInterval(cargarPedidos, 15000);
    window.onload = cargarPedidos;
</script>

</body>
</html>
